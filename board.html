<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>创 · 看板</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#232a33; --txt:#e8edf2; --sub:#8b98a5;
    --green:#2ebd85; --red:#f6465d; --gold:#f0b90b; --blue:#4da3ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px 16px 40px;max-width:560px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  h1{font-size:22px;font-weight:700}
  .upd{color:var(--sub);font-size:13px}
  #refresh{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 16px;font-size:14px;cursor:pointer}
  .coin-head{display:flex;align-items:center;gap:12px;margin-top:20px}
  .btc-badge{width:52px;height:52px;border-radius:50%;background:#f7931a;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  .coin-name{font-size:19px;font-weight:600}
  .coin-pair{color:var(--sub);font-size:13px;margin-top:2px}
  .chg{margin-left:auto;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .price{font-size:44px;font-weight:800;letter-spacing:.5px;margin:14px 0 10px;font-variant-numeric:tabular-nums}
  .stats{color:var(--sub);font-size:14px;line-height:1.9;font-variant-numeric:tabular-nums}
  .stats b{color:var(--txt);font-weight:600}
  #spark{width:100%;height:110px;display:block;margin-top:8px}
  .spark-lab{display:flex;justify-content:space-between;color:var(--sub);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
  section{margin-top:30px}
  .sec-t{display:flex;justify-content:space-between;align-items:baseline;color:var(--sub);font-size:15px;margin-bottom:6px}
  .sec-t .r{font-size:12.5px}
  .tier{padding:13px 0 4px;border-bottom:1px solid var(--line)}
  .tier:last-child{border-bottom:none}
  .tier-row{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
  .tier-name{font-size:16.5px}
  .tier-name .pct{color:var(--sub);margin-left:8px}
  .tier-px{font-size:19px;font-weight:700;margin-left:10px}
  .tier-left{color:var(--txt);font-size:15.5px}
  .bar{height:7px;background:#1d242e;border-radius:99px;margin:12px 0 10px;overflow:hidden}
  .bar i{display:block;height:100%;background:#5b6b7f;border-radius:99px;transition:width .6s}
  .fng-num{font-size:46px;font-weight:800}
  .fng-lab{color:var(--red);font-size:19px;font-weight:700;margin-left:12px}
  .fng-bar{display:flex;gap:5px;margin-top:14px}
  .fng-bar i{flex:1;height:9px;border-radius:99px;opacity:.9}
  .fng-wrap{position:relative}
  .fng-mark{position:absolute;top:34px;width:3px;height:17px;background:#fff;border-radius:2px;transform:translateX(-1px)}
  .line-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:12px}
  .line-card h3{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:2.5px 9px;background:#1d242e;color:var(--sub)}
  .tag.live{background:rgba(46,189,133,.16);color:var(--green)}
  .tag.idle{background:rgba(240,185,11,.14);color:var(--gold)}
  .kv{display:flex;justify-content:space-between;color:var(--sub);font-size:14px;line-height:2;font-variant-numeric:tabular-nums}
  .kv b{color:var(--txt);font-weight:600}
  .kv .g{color:var(--green)} .kv .r{color:var(--red)}
  .note{color:var(--sub);font-size:12.5px;line-height:1.7;margin-top:8px}
  .mkt-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
  .mkt-row:last-child{border-bottom:none}
  .mkt-badge{width:46px;height:46px;border-radius:50%;background:#2a2f36;color:#f7931a;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .mkt-name{font-size:16.5px;font-weight:600}
  .mkt-sub{color:var(--sub);font-size:12.5px;margin-top:2px}
  .mkt-right{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
  .mkt-px{font-size:16.5px;font-weight:600}
  footer{color:var(--sub);font-size:12px;line-height:1.8;margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<header>
  <h1>创 · 看板</h1>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="upd" id="upd">—</span>
    <button id="refresh" onclick="loadAll()">刷新</button>
  </div>
</header>

<div class="coin-head">
  <div class="btc-badge">BTC</div>
  <div>
    <div class="coin-name">比特币 BTC</div>
    <div class="coin-pair">BTC/USDT · OKX 现货</div>
  </div>
  <div class="chg" id="btcChg">—</div>
</div>
<div class="price" id="btcPx">—</div>
<div class="stats" id="btcStats">24h 高 <b>—</b>&nbsp;&nbsp;24h 低 <b>—</b>&nbsp;&nbsp;24h 成交 <b>—</b><br>距历史高点 $126,080.0：<b>—</b></div>
<svg id="spark" preserveAspectRatio="none"></svg>
<div class="spark-lab"><span>48 小时前</span><span id="sparkRange">区间 —</span><span>现在</span></div>

<section>
  <div class="sec-t"><span>盯盘线 · 创钱包 BTC 回撤买入档</span><span class="r">按 90 日高点 $86,618.0 定档</span></div>
  <div id="tiers"></div>
</section>

<section>
  <div class="sec-t"><span>恐慌贪婪指数</span><span class="r" id="fngYday"></span></div>
  <div class="fng-wrap">
    <div><span class="fng-num" id="fngNum">—</span><span class="fng-lab" id="fngLab"></span></div>
    <div class="fng-bar">
      <i style="background:#e23e57"></i><i style="background:#ea7a4b"></i><i style="background:#e3c341"></i><i style="background:#93d13d"></i><i style="background:#16c784"></i>
    </div>
    <div class="fng-mark" id="fngMark" style="left:25%"></div>
  </div>
</section>

<section>
  <div class="sec-t"><span>创的线</span><span class="r">六条线 · 各自独立记账</span></div>
  <div id="lines"></div>
</section>

<section>
  <div class="sec-t"><span>持仓</span><span class="r">创名下三摊 · 按标的本身记，不换算</span></div>
  <div id="holds"></div>
</section>

<section>
  <div class="sec-t"><span>行情</span><span class="r">OKX 现货</span></div>
  <div id="mkt"></div>
</section>

<footer id="foot"></footer>
<script>
var ATH=126080, HP90=86618;
var FALLBACK={px:75869.5,chg:0.24,high:76378.7,low:74887.9,vol:545300000,fng:25,fngY:28};
var ORDER3={contracts:0.07,btc:0.0007,avg:77785.7,inRisk:4.36,inRiskPct:0.88,liq:52181.9,
  lots:[["第一笔","0.02 张 · 78,500","止损 72,220"],["补仓","0.05 张 · 77,500","止损 71,300"]]};
var TIERS=[["第一档",-20,69294],["第二档",-30,60633],["第三档",-40,51971]];
var IDX={spx:null,ndq:null,gold:null};
function $(id){return document.getElementById(id)}
function fmt(n,d){if(n==null||isNaN(n))return "—";return n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})}
function pct(n){if(n==null||isNaN(n))return "—";return (n>=0?"+":"")+n.toFixed(2)+"%"}
function cls(n){return n>=0?"var(--green)":"var(--red)"}
function setChg(el,n){el.textContent=pct(n);el.style.color=cls(n)}

function renderTiers(px){
  var dd=(px/HP90-1)*100, h="";
  TIERS.forEach(function(t){
    var left=(t[2]/px-1)*100, w=Math.min(100,Math.max(0,dd/t[1]*100));
    h+='<div class="tier"><div class="tier-row"><div class="tier-name">'+t[0]+'<span class="pct">'+t[1]+'%</span><span class="tier-px">$'+fmt(t[2],1)+'</span></div>'
      +'<div class="tier-left">还差&nbsp; '+left.toFixed(1)+'%</div></div><div class="bar"><i style="width:'+w.toFixed(0)+'%"></i></div></div>';
  });
  $("tiers").innerHTML=h;
}
function renderLines(px){
  var pnl=(px-ORDER3.avg)*ORDER3.btc, pnlPct=(px/ORDER3.avg-1)*100;
  var stopDist=(px-72220)/px*100;
  var lots="";
  ORDER3.lots.forEach(function(l){lots+='<div class="kv"><span>'+l[0]+' '+l[1]+'</span><b>'+l[2]+'</b></div>'});
  var h="";
  h+='<div class="line-card"><h3>线1 · BTC 长拿（交易） <span class="tag live">运行中</span></h3>'
    +'<div class="kv"><span>第 3 单 · 多单 '+ORDER3.contracts+' 张</span><b>均价 '+fmt(ORDER3.avg,1)+'</b></div>'
    +lots
    +'<div class="kv"><span>按现价浮动</span><b style="color:'+cls(pnl)+'">'+(pnl>=0?"+":"−")+'$'+fmt(Math.abs(pnl),2)+'（'+pct(pnlPct)+'）</b></div>'
    +'<div class="kv"><span>离主止损 72,220 还差</span><b>'+stopDist.toFixed(1)+'%</b></div>'
    +'<div class="kv"><span>全单在险</span><b>$'+ORDER3.inRisk+' ≈ '+ORDER3.inRiskPct+'%</b></div>'
    +'<div class="note">止损挂在交易所，整笔进出；状态：拿着先。</div></div>';
  h+='<div class="line-card"><h3>线2 · 创钱包（长持） <span class="tag live">运行中</span></h3>'
    +'<div class="kv"><span>BTC</span><b>0.00496387</b></div>'
    +'<div class="kv"><span>IMX</span><b>21</b></div>'
    +'<div class="kv"><span>USDT</span><b>≈ 0.4</b></div>'
    +'<div class="note">只买不卖的长持线：回撤三档见上方盯盘线，到档由本人自己在钱包买入。</div></div>';
  h+='<div class="line-card"><h3>线3 · 标普 500 <span class="tag idle">已立线 · 未投钱</span></h3>'
    +'<div class="kv"><span>标普 500 指数</span><b id="spxPx">'+(IDX.spx?fmt(IDX.spx,1):"—")+'</b></div>'
    +'<div class="note">定投篮子成员（标普＋纳指＋黄金），过年后再启动，现在只看价。</div></div>';
  h+='<div class="line-card"><h3>线4 · 纳指 <span class="tag idle">已立线 · 未投钱</span></h3>'
    +'<div class="kv"><span>纳斯达克 100 指数</span><b id="ndqPx">'+(IDX.ndq?fmt(IDX.ndq,1):"—")+'</b></div>'
    +'<div class="note">定投篮子成员，过年后再启动，现在只看价。</div></div>';
  h+='<div class="line-card"><h3>线5 · 黄金 <span class="tag idle">已立线 · 未投钱</span></h3>'
    +'<div class="kv"><span>黄金现货（美元/盎司）</span><b id="goldPx">'+(IDX.gold?"$"+fmt(IDX.gold,1):"—")+'</b></div>'
    +'<div class="note">定投篮子成员，过年后再启动，现在只看价。</div></div>';
  h+='<div class="line-card"><h3>线6 · 个股 <span class="tag">未开</span></h3>'
    +'<div class="note">空线，暂无个股立项。</div></div>';
  $("lines").innerHTML=h;
}
function renderHolds(){
  var h="";
  h+='<div class="line-card"><h3>创 Wallet（长持钱包）</h3>'
    +'<div class="kv"><span>BTC</span><b>0.00496387</b></div>'
    +'<div class="kv"><span>IMX</span><b>21</b></div>'
    +'<div class="kv"><span>USDT</span><b>≈ 0.4</b></div></div>';
  h+='<div class="line-card"><h3>OKX 交易资金</h3>'
    +'<div class="kv"><span>交易账户</span><b>$74.07</b></div>'
    +'<div class="kv"><span>简单赚币（活期）</span><b>$420.59</b></div>'
    +'<div class="kv"><span>合计</span><b>$494.66</b></div>'
    +'<div class="note">读数日期 2026-11-05；闲置资金只放活期，三个口袋分开记。</div></div>';
  h+='<div class="line-card"><h3>国金证券账户</h3>'
    +'<div class="kv"><span>标普500ETF博时 513500</span><b>300 份 · 成本 2.695</b></div>'
    +'<div class="kv"><span>纳指ETF广发 159941</span><b>100 份 · 成本 1.634</b></div>'
    +'<div class="kv"><span>账户现金</span><b>在户</b></div>'
    +'<div class="note">存量放着不动，不再新增买入。</div></div>';
  $("holds").innerHTML=h;
}
function renderMkt(rows){
  var names={BTC:"比特币",ETH:"以太坊",SOL:"Solana",XRP:"瑞波",DOGE:"狗狗币",IMX:"Immutable"};
  var h="";
  rows.forEach(function(r){
    h+='<div class="mkt-row"><div class="mkt-badge">'+r.sym+'</div><div><div class="mkt-name">'+r.sym+' <span style="color:var(--sub);font-weight:400;font-size:13.5px">'+(names[r.sym]||"")+'</span></div>'
      +'<div class="mkt-sub">24h 高 '+fmt(r.high, r.px<10?4:1)+' · 低 '+fmt(r.low, r.px<10?4:1)+'</div></div>'
      +'<div class="mkt-right"><div class="mkt-px">$'+fmt(r.px, r.px<10?4:2)+'</div><div style="color:'+cls(r.chg)+';font-size:13.5px">'+pct(r.chg)+'</div></div></div>';
  });
  $("mkt").innerHTML=h;
}
function drawSpark(closes){
  if(!closes||closes.length<2)return;
  var svg=$("spark"), W=svg.clientWidth||340, H=110;
  var min=Math.min.apply(null,closes), max=Math.max.apply(null,closes), rng=(max-min)||1;
  var pts=closes.map(function(c,i){return (i/(closes.length-1)*W).toFixed(1)+","+(H-8-((c-min)/rng)*(H-16)).toFixed(1)}).join(" ");
  var up=closes[closes.length-1]>=closes[0], col=up?"#2ebd85":"#f6465d";
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.innerHTML='<polygon points="0,'+H+' '+pts+' '+W+','+H+'" fill="'+col+'" opacity="0.13"></polygon><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2"></polyline>';
  $("sparkRange").textContent="区间 $"+fmt(min,1)+" — $"+fmt(max,1);
}
function setBtc(px,chg,high,low,vol){
  $("btcPx").textContent="$"+fmt(px,1);
  setChg($("btcChg"),chg);
  $("btcStats").innerHTML="24h 高 <b>$"+fmt(high,1)+"</b>&nbsp;&nbsp;24h 低 <b>$"+fmt(low,1)+"</b>&nbsp;&nbsp;24h 成交 <b>$"+(vol>=1e6?(vol/1e6).toFixed(1)+"M":fmt(vol,0))+"</b><br>距历史高点 $126,080.0：<b>"+(px/ATH-1>=0?"+":"")+((px/ATH-1)*100).toFixed(1)+"%</b>";
  renderTiers(px); renderLines(px);
}
function setFng(v,y){
  $("fngNum").textContent=v;
  var lab=v<=25?"极度恐慌":v<=45?"恐慌":v<=55?"中性":v<=75?"贪婪":"极度贪婪";
  var el=$("fngLab"); el.textContent=lab; el.style.color=v<=45?"var(--red)":v<=55?"#e3c341":"var(--green)";
  $("fngMark").style.left="calc("+v+"% - 1px)";
  if(y!=null)$("fngYday").textContent="昨日 "+y+" "+(v<y?"↓ "+(y-v):v>y?"↑ "+(v-y):"→ 0");
}
function foot(){
  var d=new Date(), hh=("0"+d.getHours()).slice(-2), mm=("0"+d.getMinutes()).slice(-2);
  $("upd").textContent=hh+":"+mm+" 更新";
  $("foot").innerHTML="行情来源：OKX 公开行情（打开与刷新时实时拉取）· 恐慌贪婪 alternative.me · 指数与黄金 Stooq。<br>持仓与各线状态为 2026-11-07 版，交易有变动时更新；资产按标的本身记录，不做币种换算。";
}
function ticker(inst){return fetch("https://www.okx.com/api/v5/market/ticker?instId="+inst).then(function(r){return r.json()}).then(function(j){return j.data[0]})}
function loadAll(){
  foot();
  ticker("BTC-USDT").then(function(t){
    var px=parseFloat(t.last), open=parseFloat(t.open24h);
    setBtc(px,(px/open-1)*100,parseFloat(t.high24h),parseFloat(t.low24h),parseFloat(t.volCcy24h));
  }).catch(function(){ setBtc(FALLBACK.px,FALLBACK.chg,FALLBACK.high,FALLBACK.low,FALLBACK.vol); });
  fetch("https://www.okx.com/api/v5/market/candles?instId=BTC-USDT&bar=1H&limit=48").then(function(r){return r.json()}).then(function(j){
    var closes=j.data.map(function(c){return parseFloat(c[4])}).reverse(); drawSpark(closes);
  }).catch(function(){});
  var syms=["BTC","ETH","SOL","XRP","DOGE","IMX"];
  Promise.all(syms.map(function(s){return ticker(s+"-USDT").then(function(t){return {sym:s,px:parseFloat(t.last),chg:(parseFloat(t.last)/parseFloat(t.open24h)-1)*100,high:parseFloat(t.high24h),low:parseFloat(t.low24h)}}).catch(function(){return null})}))
    .then(function(rows){renderMkt(rows.filter(Boolean))});
  fetch("https://api.alternative.me/fng/?limit=2").then(function(r){return r.json()}).then(function(j){
    setFng(parseInt(j.data[0].value), j.data[1]?parseInt(j.data[1].value):null);
  }).catch(function(){ setFng(FALLBACK.fng,FALLBACK.fngY); });
  [["%5Espx","spx","spxPx",0],["%5Endq","ndq","ndqPx",0],["xauusd","gold","goldPx",1]].forEach(function(cfg){
    fetch("https://stooq.com/q/l/?s="+cfg[0]+"&f=c&e=csv").then(function(r){return r.text()}).then(function(txt){
      var v=parseFloat(txt.split(/\r?\n/)[1]); if(!isNaN(v)){IDX[cfg[1]]=v; var el=$(cfg[2]); if(el)el.textContent=(cfg[3]?"$":"")+fmt(v,1);}
    }).catch(function(){});
  });
}
setBtc(FALLBACK.px,FALLBACK.chg,FALLBACK.high,FALLBACK.low,FALLBACK.vol);
setFng(FALLBACK.fng,FALLBACK.fngY);
renderHolds(); renderMkt([]);
loadAll();
setInterval(loadAll,60000);
</script>
</body>
</html>
